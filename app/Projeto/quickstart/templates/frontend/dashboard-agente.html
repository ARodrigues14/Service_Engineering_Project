{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ...existing code... -->
</head>
<body>
     <!-- wrapper   ##########################################################-->
     <div id="wrapper" class="container">
        <!-- navbar   ##########################################################-->
        <div id="navbar" class="container">
            <nav class="navbar navbar-expand-md cor-navbar">
                <div class="container-fluid">
                    <!-- Logotipo ou Menu à Esquerda -->
                    <a class="navbar-brand text-white me-2" href="index.html">Service Engineering (MECD) - Loaning - 2024/2025 </a>
                  
                    <!-- Botão de Toggle para Mobile -->
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <!-- Menu principal com itens alinhados à esquerda e à direita 
                        Tudo  que estiver dentro do colapse, vai ficar escondido no mobile-->
                        <div class="collapse navbar-collapse" id="navbarSupportedContent">
                            <!-- Itens à esquerda -->
                            <ul class="navbar-nav ms-5 me-auto mb-2 mb-md-0">
                                
                            </ul>
                            <!-- Itens à direita -->
                            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                                <li class="nav-item"><a class="nav-link" href="login-cliente.html">Client</a></li>
                                <li class="nav-item"><a class="nav-link" href="login-agente.html">Loan officer</a></li>
                            </ul>
                        </div>

                </div>
            </nav>
        </div>

        <!-- main   ###########################################################-->
        <div id="main" class="container-fluid d-flex justify-content-center">
            <div id="card-loan" class="shadow-lg my-5 text-center p-3">
                
                <h5 class="texto-roxo">Dashboard- Loan officer</h5>

                <div id="dateDisplay" class="mt-3"></div> <!-- Ensure this ID is unique and correct -->

                <!-- estrutura da tabela-->
                <div id="tabela" class="table-div mt-3">
                    <!-- Table will be dynamically populated here -->
                </div><!-- fim tabela-->

                <div id="loan-details" style="display: none;">
                    <h6 class="texto-roxo mt-5">Edit loan Request</h6>
                    <hr>
                    <div class="row mb-4">
                        <!--codigo-->
                        <div class="col-6 f-zebar1  border-bottom">
                            <label class="form-label fw-bold">Code:</label>
                        </div>
                        <div class="col-6 f-zebar1 border-bottom">
                            <label id="code" class="form-label">1</label>
                        </div>
                        <!--data-->
                        <div class="col-6 f-zebar2  border-bottom">
                            <label class="form-label fw-bold">Loan Request date:</label>
                        </div>
                        <div class="col-6 f-zebar2  border-bottom">
                            <label id="loan_date" class="form-label">15-12-2024</label>
                        </div>
                        <!--nome-->
                        <div class="col-6 f-zebar1  border-bottom">
                            <label class="form-label fw-bold">Name:</label>
                        </div>
                        <div class="col-6 f-zebar1  border-bottom">
                            <label id="clientName" class="form-label">Maria</label>
                        </div>
                        <!--valor-->
                        <div class="col-6 f-zebar2  border-bottom">
                            <label class="form-label fw-bold">Valor:</label>
                        </div>
                        <div class="col-6 f-zebar2  border-bottom">
                            <label id="valor" class="form-label">5000.00 €</label>
                        </div>
                        <!--duração-->
                        <div class="col-6 f-zebar1  border-bottom">
                            <label class="form-label fw-bold">Duration:</label>
                        </div>
                        <div class="col-6 f-zebar1  border-bottom">
                            <label id="duration" class="form-label">24 months</label>
                        </div>
                        <!--prestação-->
                        <div class="col-6 f-zebar2  border-bottom">
                            <label class="form-label fw-bold">Monthly Payment:</label>
                        </div>
                        <div class="col-6 f-zebar2  border-bottom">
                            <label id="payment" class="form-label">150,00 €</label>
                        </div>
                        <!--status (pendente, resolvido)-->
                        <div class="col-md-6 f-zebar1  border-bottom">
                            <label class="form-label fw-bold">Status:</label>
                        </div>
                        <div class="col-md-6 checkbox-column f-zebar1 border-bottom">
                            <div class="form-check custom-checkbox">
                                <input type="radio" id="Pending" name="status" class="form-check-input" checked>
                                <label for="Pending" class="form-check-label">Pending</label>
                            </div>
                            <div class="form-check custom-checkbox">
                                <input type="radio" id="Solved" name="status" class="form-check-input">
                                <label for="Solved" class="form-check-label text-cor2">Solved</label>
                            </div>
                        </div>
                        <!--classificar (i,ii,iii)-->
                        <div class="col-md-6 f-zebar2  border-bottom mt-2">
                            <label class="form-label fw-bold">classify:</label>
                        </div>
                        <div class="col-md-4 checkbox-column f-zebar2  border-bottom mt-2">
                            <div class="form-check custom-checkbox">
                                <input type="checkbox" id="checkbox11" class="form-check-input">
                                <label for="Solved" class="form-check-label form-check-label">i-Accept</label>
                            </div>
                            <div class="form-check custom-checkbox">
                                <input type="checkbox" id="checkbox12" class="form-check-input">
                                <label for="Pending" class="form-check-label form-check-label">ii-Interview</label>
                            </div>
                            <div class="form-check custom-checkbox">
                                <input type="checkbox" id="checkbox13" class="form-check-input">
                                <label for="Solved" class="form-check-label form-check-label">iii-Reject</label>
                            </div>
                        </div>
                        <div class="col-md-2 checkbox-column f-zebar2  border-bottom mt-2">
                            <button id="btnCalculate" class="btn btn-sm btn-primary">See Dates</button>
                        </div>
                        <!--entrevista-data-->
                        <div class="col-6 f-zebar1 border-bottom">
                            <label class="form-label fw-bold">Enterview Date:</label>
                        </div>
                        <div class="col-6 f-zebar1  border-bottom">
                            <label id="date_interview" class="form-label">16-12-2024</label>
                        </div>
                        <!--entrevista-status-->
                        <div class="col-md-6 f-zebar2  border-bottom mt-2">
                            <label class="form-label fw-bold">Enterview - Status:</label>
                        </div>
                        <div class="col-md-4 checkbox-column f-zebar2  border-bottom mt-2">
                            <div class="form-check custom-checkbox">
                                <input type="checkbox" id="checkbox31" class="form-check-input">
                                <label for="checkbox1" class="form-check-label form-check-label">i-Acept</label>
                            </div>
                            <div class="form-check custom-checkbox">
                                <input type="checkbox" id="checkbox32" class="form-check-input"  checked>
                                <label for="checkbox2" class="form-check-label form-check-label">ii-Reject</label>
                            </div>
                        </div>
                        <div class="col-md-2 checkbox-column f-zebar1  border-bottom mt-2">
                            <button id="btnOK" class="btn btn-sm btn-primary">OK</button>
                        </div>
                        <!--buttons-->
                        <div class="row d-flex justify-content-around mt-5">
                            <div class="col-auto">
                                <button id="btnCancel" type="button" class="btn btn-secondary">Cancel</button>
                            </div>
                            <div class="col-auto">
                                <button id="btnEnviar" type="button" class="btn btn-primary">Send</button>
                            </div>
                        </div>
                    </div><!-- fim da row -->
                </div><!-- fim loan-details -->
            </div>
        </div>

        <!-- footer  ##########################################################-->
        <div id="footer" class="text-white p-4">
            Afonso-Constança-Núria 
        </div>
     </div>


    <!-- Modal for date selection -->
    <div class="modal fade" id="dateModal" tabindex="-1" aria-labelledby="dateModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="dateModalLabel">Select a Date</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalDateList">
                    <!-- Dates will be dynamically populated here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!--#####################################################################-->
    <!--Javascript-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="{% static 'dashboard-agent.js' %}"></script>
</body>
</html>
