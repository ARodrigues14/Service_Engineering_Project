{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MECD - Dashboard Cliente</title>

    <!-- google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- fontawesome-->
    <script src="https://kit.fontawesome.com/f065e2e831.js" crossorigin="anonymous"></script>

    <!-- bootstrap icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

     <!-- bootstrap-->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">


    <!-- estilo site-->
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
     <!-- wrapper   ##########################################################-->
     <div id="wrapper" class="container">
        <!-- navbar   ##########################################################-->
        <div id="navbar" class="container">
            <nav class="navbar navbar-expand-md cor-navbar">
                <div class="container-fluid">
                    <!-- Logotipo ou Menu à Esquerda -->
                    <a class="navbar-brand text-white me-2" href="index.html">Service Engineering (MECD) - Loaning - 2024/2025</a>
                  
                    <!-- Botão de Toggle para Mobile -->
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <!-- Menu principal com itens alinhados à esquerda e à direita 
                        Tudo  que estiver dentro do colapse, vai ficar escondido no mobile-->
                        <div class="collapse navbar-collapse" id="navbarSupportedContent">
                            <!-- Itens à esquerda -->
                            <ul class="navbar-nav ms-5 me-auto mb-2 mb-md-0">
                                
                            </ul>
                            <!-- Itens à direita -->
                            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                                <li class="nav-item"><a class="nav-link" href="login-cliente.html">Client</a></li>
                                <li class="nav-item"><a class="nav-link" href="login-agente.html">Loan officer</a></li>
                            </ul>
                        </div>

                </div>
            </nav>
        </div>

        <!-- main   ###########################################################-->
        <div id="main" class="container-fluid d-flex justify-content-center">
            <div id="card-loan" class="shadow-lg my-5 text-center p-3">
                
                <h5 class="texto-roxo">Loan Status</h5>
                <hr>
                <div class="row mb-4">
                    <div class="col-6 f-zebar2">
                        <label class="form-label fw-bold">Loan Date:</label>
                    </div>
                    <div class="col-6 f-zebar2">
                        <label id="data" class="form-label">15-12-2024</label>
                    </div>
                    <div class="col-6 f-zebar1">
                        <label class="form-label fw-bold">Name:</label>
                    </div>
                    <div class="col-6 f-zebar1">
                        <label id="nome" class="form-label">Maria</label>
                    </div>
                    <div class="col-6 f-zebar2">
                        <label class="form-label fw-bold">Value:</label>
                    </div>
                    <div class="col-6 f-zebar2">
                        <label id="valor" class="form-label">5000.00 €</label>
                    </div>
                    <div class="col-6 f-zebar1">
                        <label class="form-label fw-bold">Duration:</label>
                    </div>
                    <div class="col-6 f-zebar1">
                        <label id="duracao" class="form-label">24 months</label>
                    </div>
                    <div class="col-6 f-zebar2">
                        <label class="form-label fw-bold">Monthly Payment:</label>
                    </div>
                    <div class="col-6 f-zebar2">
                        <label id="prestacao" class="form-label">150,00 €</label>
                    </div>
                    <div class="col-6 f-zebar1">
                        <label class="form-label fw-bold">TAN:</label>
                    </div>
                    <div class="col-6 f-zebar1">
                        <label class="form-label">8.0%</label>
                    </div>
                    <div class="col-6 f-zebar2">
                        <label class="form-label fw-bold">TAEG:</label>
                    </div>
                    <div class="col-6 f-zebar2">
                        <label class="form-label">12.0%</label>
                    </div>
                    <div class="col-6 f-zebar1">
                        <label class="form-label fw-bold">Status:</label>
                    </div>
                    <div class="col-6 f-zebar1">
                        <label id="estado" class="form-label">Pending</label>
                    </div>
                    <hr>
                    <div class="row align-items-center">
                        <!-- Label ocupa col-6 -->
                        <div class="col-6 f-zebar2">
                            <label class="form-label fw-bold">schedule an interview:</label>
                        </div>
                        <!-- Select ocupa col-3 -->
                        <div class="col-3 f-zebar2">
                            <select id="entrevistaSelect" class="form-select">
                                <option value="1">Opção 1</option>
                                <option value="2">Opção 2</option>
                                <option value="3">Opção 3</option>
                            </select>
                        </div>
                        <!-- Botão ocupa col-3 -->
                        <div class="col-3  f-zebar2">
                            <button id="bME" class="btn btn-primary btn-sm w-100">Schedule</button>
                        </div>
                    </div>
                    <hr class="mt-3">
                    <div class="col-6 f-zebar1">
                        <label class="form-label fw-bold">Interview:</label>
                    </div>
                    <div class="col-6 f-zebar1">
                        <label id="interview-date" class="form-label">16-12-2024 : 10.00h</label>
                    </div>
                    <hr>
                    <div class="col-6 f-zebar2">
                        <label class="form-label fw-bold">Final Decision:</label>
                    </div>
                    <div class="col-6 f-zebar2">
                        <label id="final-decision" class="form-label">---</label>
                    </div>
                    <hr>
                </div>
                
                <div class="d-flex justify-content-around mt-3">
                    <a id="logout" class="btn btn-primary py-2 px-5 my-2 shadow-lg" href="">Logout</a>
                </div>

               

            </div>
        </div>

        <!-- footer  ##########################################################-->
        <div id="footer" class="text-white p-4">
            bla bla bla
        </div>


     </div>


    <!--#####################################################################-->
    <!--Javascript-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"  crossorigin="anonymous"></script>

    <script src="js/main.js"></script>
    <script src="{% static 'dashboard-client.js' %}"></script>
    
</body>
</html>
