{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MECD - Login</title>

    <!-- google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- fontawesome-->
    <script src="https://kit.fontawesome.com/f065e2e831.js" crossorigin="anonymous"></script>

    <!-- bootstrap icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

     <!-- bootstrap-->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">



    <!-- estilo site-->
    <link rel="stylesheet" href="{% static 'style.css' %}">
 
</head>
<body>
     <!-- wrapper   ##########################################################-->
     <div id="wrapper" class="container wrapper-login">
        <!-- navbar   ##########################################################-->
        <div id="navbar" class="container" >
            <nav class="navbar navbar-expand-md cor-navbar">
                <div class="container-fluid">
                    <!-- Logotipo ou Menu à Esquerda -->
                    <a class="navbar-brand text-white me-2" href="index.html">Service Engineering (MECD) - Loaning - 2024/2025</a>
                  
                    <!-- Botão de Toggle para Mobile -->
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <!-- Menu principal com itens alinhados à esquerda e à direita 
                        Tudo  que estiver dentro do colapse, vai ficar escondido no mobile-->
                        <div class="collapse navbar-collapse" id="navbarSupportedContent">
                            <!-- Itens à esquerda -->
                            <ul class="navbar-nav ms-5 me-auto mb-2 mb-md-0">
                                
                            </ul>
                            <!-- Itens à direita -->
                            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                                <li class="nav-item"><a class="nav-link" href="login-cliente.html">Cliente</a></li>
                                <li class="nav-item"><a class="nav-link" href="login-agente.html">Loan officer</a></li>
                            </ul>
                        </div>

                </div>
            </nav>
        </div>

        <!-- main   ###########################################################-->
        <div id="main" class="container-full-height d-flex justify-content-center align-items-center"   style="min-height: 80vh;">
            <div id="card-loan" class="shadow-lg my-5 text-center p-3">
                
                <h5 class="texto-roxo mt-4">Login - Loan officer</h5>
                <form>
                    {% csrf_token %}
                    <div class="my-3">
                        <label for="username" class="form-label">Email Loan officer</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" id="login-agente" class="btn btn-login w-100 text-white mt-5">Login</button>
                
                    <!-- Mensagem de erro -->
                    <div id="error-message" style="display: none; color: red;">
                        Invalid username or password. Please try again.
                    </div>
                </form>
                
                <!-- <input type="hidden" id="csrf_token" value="{{ csrf_token }}"> -->
                


            </div>
        </div>

        <!-- footer  ##########################################################-->
        <div id="footer" class="text-white p-4">
            Afonso-Constança-Núria © 2024/2025
        </div>


     </div>


    <!--#####################################################################-->
    <!--Javascript-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"  crossorigin="anonymous"></script>

    <script>
        const loginUrl = "{% url 'login_view_agent' %}";
     </script>
     
    <script src="{% static 'login-agente.js' %}"></script>




</body>
</html>
