                            </ul>

                </div>

        <!-- main   ###########################################################-->

        <div id="main" class="container-fluid d-flex justify-content-center">
            <div class="row container-fluid">

                <div class="col-md-7">
                    <div class="card-loan1 shadow-lg my-5 text-center p-3">
                        
                        <h5 class="texto-roxo">bank loan online</h5>
                        <p class="">What amount do you want (Euros)?</p>
                        <!-- slider 1 - montante-->
                        <div>
                            <div class="container">
                                <div class="slider1-container">
                                    <!-- Caixa do slider com os ícones -->
                                    <div class="slider1-box">
                                        <span  class="slider1-icons" id="decrease1">-</span>
                                        <span id="slider1-value">1500</span>
                                        <span class="slider1-icons" id="increase1">+</span>
                                    </div>
                            
                                    <!-- Barra do slider -->
                                    <input type="range" id="slider1" class="slider1-track" min="1500" max="75000" value="1500" step="500">
                            
                                    <!-- Labels abaixo da barra -->
                                    <div class="slider1-labels">
                                        <span>1500</span>
                                        <span>75000</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <p class="">In how many months?</p>
                        <!-- slider 2 - meses-->
                        <div>
                            <div class="container">
                                <div class="slider2-container">
                                    <!-- Caixa do slider com os ícones -->
                                    <div class="slider2-box">

                                        </div>

                                    </div>
                                </a>
                            </div>

                                    <div class=" ">
                                        <div class=" mb-3">
                                            <i class="fa-solid fa-car mt-3" style="color: #014991; font-size: 32px;"></i>
                                        </div>
                                        <p>Vehicle</p>                                       
                                    </div>

                            </div>

                                        </div>
                                        <p>Build</p>                                       
                                    </div>
                                </a>
                            </div>
                             <!----Card 4----->
                            <div class="col-lg-3 col-sm-6 ">
                                <a id="Education" class="d-block text-center p-1 card-tipo shadow" href="javascript:void(0);" onclick="changeLoanType('Education')">
                                    <div class=" ">
                                        <div class=" mb-3">
                                            <i class="fa-solid fa-school mt-3" style="color: #014991; font-size: 32px;"></i>
                                        </div>
                                        <p>Education</p>                                     
                                    </div>
                                </a>
                            </div>
                        </div><!---fim row-->

                        <!----Resumo empréstimo-->
                        <div class="row my-5">
                            
                            <div class="col-6 f-zebar1">
                                <label class="form-label fw-bold">Type:</label>
                            </div>
                            <div id="tipo" class="col-6 f-zebar1">

                            <div class="col-6 f-zebar2">
                                <label class="form-label fw-bold">Value:</label>
                            </div>
                            <div class="col-6 f-zebar2">

                                <label class="form-label fw-bold">Duration:</label>

                            </div>
                            <div class="col-6 f-zebar2">
                                <label class="form-label fw-bold">monthly payment:</label>
                            </div>
                            <div class="col-6 f-zebar2">
                                <label id="installment" class="form-label">130,48 €</label>
                            </div>
                            <div class="col-6 f-zebar1">
                                <label class="form-label fw-bold">TAN:</label>
                            </div>
                            <div class="col-6 f-zebar1">
                                <label class="form-label">8.0%</label>
                            </div>
                            <div class="col-6 f-zebar2">
                                <label class="form-label fw-bold">TAEG:</label>
                            </div>
                            <div class="col-6 f-zebar2">
                                <label class="form-label">12.0%</label>
                            </div>
                            <div class="col-6 f-zebar1">
                                <label class="form-label fw-bold">Value with Interest</label>
                            </div>
                            <div class="col-6 f-zebar1">
                                <label id="amount-interest" class="form-label">1628,18 €</label>
                            </div>
                        </div>
                        <!-- button-->
                        <div class="d-flex justify-content-around mt-0">
                            <a id="requestCredit" class="btn btn-primary py-2 px-5 my-3 shadow-lg" href="login-cliente1.html">Request Credit</a>  <!--login-cliente1.html-->
                        </div>
